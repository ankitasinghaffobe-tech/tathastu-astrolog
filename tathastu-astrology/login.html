<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Tathastu Astrology</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="celestial-nav">
        <a href="index.html" class="nav-brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent-gold);"><path d="M12 2v20M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>TATHASTU</a>
    </nav>

    <main class="page-container" style="display:flex; align-items:center; justify-content:center;">
        <div class="glass-panel auth-center-frame">
            <h2>Portal Access Node</h2>
            <div id="authErrorDisplay" class="auth-error-msg">Validation Failed: Credentials outside calculated clearance parameters.</div>
            <form id="systemLoginForm" onsubmit="window.executeStaticAuthentication(event)">
                <div class="input-block" style="margin-bottom:20px;">
                    <label>Identity Clearance Identifier (Email)</label>
                    <input type="text" id="authEmailInput" required placeholder="user@123 or admin@123">
                </div>
                <div class="input-block" style="margin-bottom:25px;">
                    <label>Cryptographic Passkey (Password)</label>
                    <input type="password" id="authPasswordInput" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-gold" style="width:100%;">Execute Clearance Verification</button>
            </form>
            <div style="margin-top:25px; border-top:1px dashed var(--glass-border); padding-top:15px; font-size:0.8rem; color:var(--text-muted); text-align:center;">
                <p>User Token: user@123 | userdemo</p>
                <p>Admin Token: admin@123 | admindemo</p>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
